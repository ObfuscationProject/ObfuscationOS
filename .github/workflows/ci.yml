name: obfuscationos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  distro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev e2fsprogs
      - name: Cache x86_64 userland toolchain
        uses: actions/cache@v4
        with:
          path: toolchains/x86_64-elf
          key: ok-user-x86_64-binutils-2.42-gcc-14.2.0
      - name: Build x86_64 userland toolchain
        run: xmake toolchains -a x86_64 -j 2
      - name: Configure distro
        run: xmake f -c -m debug -a x86_64
      - name: Validate kernel submodule
        run: xmake -y -b kernel-submodule-check
      - name: Validate UAPI and libc
        run: |
          xmake -y -b uapi-test
          xmake -y -b libc-test
      - name: Build root filesystem images
        run: |
          xmake -y -b rootfs-simplefs
          xmake -y -b rootfs-ext4
