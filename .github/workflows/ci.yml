name: obfuscationos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  distro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential e2fsprogs
      - name: Configure distro
        run: xmake f -c -y -m debug -a x86_64
      - name: Validate kernel submodule
        run: xmake -y -b kernel-submodule-check
      - name: Validate UAPI and libc
        run: |
          xmake -y -b uapi-test
          xmake -y -b libc-test
      - name: Build root filesystem images
        run: |
          xmake -y -b rootfs-simplefs
          xmake -y -b rootfs-ext4
